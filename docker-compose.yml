version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: antony-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: antony
      POSTGRES_PASSWORD: antony
      POSTGRES_DB: antony_recordatorios
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antony -d antony_recordatorios"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: antony-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
